name: Unit Testing

on:
    workflow_call:

jobs:
    unit-testing:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Install Rokit
              uses: CompeyDev/setup-rokit@v0.1.2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Pesde
              uses: lumin-org/setup-pesde@v0.4.1
              with:
                  version: v0.7.0-rc.7+registry.0.2.3-rc.3

            - name: Install Packages
              run: pesde install

            - name: Run Unit Tests
              id: run_tests
              # the spec errors (non-zero exit) when any case fails
              run: lune run tests/replecs.spec.luau
